name: Expériences Lab 3
on:
  push:
  workflow_dispatch:      

permissions:
  contents: write

jobs:
  experiments:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation de Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Échantillonnage
        run: python sample.py fm/experiment.uvl --size 30 --seed 1 --include configs/*.csvconf -o configs/sample.csv

      - name: Lancement des expériences
        run: python run.py

      - name: Commit et push des résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configs/sample.csv results/
          git diff --staged --quiet || git commit -m "Résultats ${{ matrix.os }}"
          # les 3 jobs poussent en même temps : si un autre a poussé entre-temps, on réessaie
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((RANDOM % 10 + 5))
          done
          exit 1
