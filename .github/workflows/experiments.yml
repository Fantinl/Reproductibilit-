name: Expériences Lab 3
on: [push]

permissions:
  contents: write

jobs:
  experiments:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Échantillonnage
        run: python sample.py fm/experiment.uvl --size 30 --seed 1 --include configs/*.csvconf -o configs/sample.csv

      - name: Lancement des expériences
        run: python run.py

      - name: Commit et push des résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configs/sample.csv results/
          git diff --staged --quiet || git commit -m "Résultats ${{ matrix.os }}"
          git pull --rebase
          git push
