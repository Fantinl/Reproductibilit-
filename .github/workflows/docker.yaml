name: GitHub Actions repro
on: [push]

permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Build de l'image
        run: docker build -t tp1-c TP1

      - name: Exécution du conteneur
        run: docker run --rm -v "$(pwd)/TP1":/out tp1-c

      - name: Commit et push des résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TP1/answer_associativity.txt TP1/answer_banking.txt
          git diff --staged --quiet || git commit -m "Mise à jour des résultats"
          git push
